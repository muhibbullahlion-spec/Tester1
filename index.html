<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Google Login Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
    p { color: #666; margin-bottom: 25px; font-size: 14px; }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      border: 2px solid #ddd;
      padding: 14px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: all 0.2s;
    }
    .google-btn:hover {
      background: #f5f5f5;
      border-color: #667eea;
    }
    .profile {
      display: none;
    }
    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 4px solid #667eea;
    }
    .profile h2 { color: #333; margin-bottom: 5px; }
    .profile .email { color: #888; font-size: 14px; margin-bottom: 25px; }
    .logout-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    .logout-btn:hover { background: #c82333; }
    .loading { color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Loading -->
    <div id="loading" class="loading">লোড হচ্ছে...</div>

    <!-- Login View -->
    <div id="loginView" style="display:none">
      <h1>🔐 Login Test</h1>
      <p>Google দিয়ে লগইন করুন</p>
      <button id="loginBtn" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22" alt="G">
        Sign in with Google
      </button>
    </div>

    <!-- Profile View -->
    <div id="profileView" class="profile">
      <img id="userPhoto" src="" alt="Profile">
      <h2 id="userName"></h2>
      <p class="email" id="userEmail"></p>
      <button id="logoutBtn" class="logout-btn">🚪 লগআউট</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ⬇️⬇️ এখানে আপনার firebaseConfig পেস্ট করুন ⬇️⬇️
    const firebaseConfig = {
  apiKey: "AIzaSyCbMnDdpXThJYSWr7OIaumTgBMFMAbLxZ4",
  authDomain: "tester-f6d7d.firebaseapp.com",
  projectId: "tester-f6d7d",
  storageBucket: "tester-f6d7d.firebasestorage.app",
  messagingSenderId: "187430206641",
  appId: "1:187430206641:web:b1459e8a02c8aaffc87690",
  measurementId: "G-S096KX2J51"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loading = document.getElementById("loading");
    const loginView = document.getElementById("loginView");
    const profileView = document.getElementById("profileView");

    // Login
    document.getElementById("loginBtn").onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("লগইন ব্যর্থ: " + err.message);
      }
    };

    // Logout
    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    // Auth state change
    onAuthStateChanged(auth, (user) => {
      loading.style.display = "none";

      if (user) {
        loginView.style.display = "none";
        profileView.style.display = "block";
        document.getElementById("userPhoto").src = user.photoURL || "";
        document.getElementById("userName").textContent = user.displayName;
        document.getElementById("userEmail").textContent = user.email;
        console.log("Logged in UID:", user.uid);
      } else {
        loginView.style.display = "block";
        profileView.style.display = "none";
      }
    });
  </script>

</body>
</html>
